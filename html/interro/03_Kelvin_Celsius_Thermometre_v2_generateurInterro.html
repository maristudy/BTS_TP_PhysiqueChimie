		<script>
		
			let nbEleves = 15;

	body=document.getElementById("sujet");
	tab=document.createElement("p");
	body.appendChild(tab);
			





			avantagesContact="<br>On peut mesurer une température de surface si la sonde ou la surface le permet | On peut mesurer une température interne lorsque la sonde pénètre dans la matière | On peut mesurer la température d'un gaz ou d'un liquide";
			inconvenientsContact="Le temps de réponse est assez lent. Il faut attendre que le thermomètre se mette à l'équilibre thermique | L'exactitude de la mesure dépend de la qualité du contact sonde/cible | La température maximale est limitée par la résistance des matériaux";
			
			avantagesIR="La mesure est instantanée | Ils peuvent mesurer les températures très élevées | Ils fonctionnent lorsqu'il est impossible de toucher la cible (liquide corrosif, cylindre en rotation) | La mesure est fiable et rapide";
			inconvenientsIR="Il peut mesurer uniquement une température de surface | On ne peut pas mesurer la température d'un gaz | il faut configurer l'emissivité | Il fonctionne avec des pile ou une batterie";
						
			tabThermometre =[ 	["Thermomètre à liquide","Un liquide coloré se dilate dans un tube en verre. ","Fonctionne sans électricité | La mesure est précise | En fonction du choix du liquide et des matériaux, il peut être utilisé entre -200°C et +1000 °C"+avantagesContact,"Le tube de verre est très fragile | "+inconvenientsContact] ,
								["Thermomètre bimétallique","Il est composé d'une lame bimétallique qui se déforme sous l'effet de la chaleur. Cette déformation fait bouger une aiguille qui indique la température","Fonctionne sans électricité | "+avantagesContact,"Le temps de réponse est lent | Ils sont sensibles aux vibrations | "+inconvenientsContact],
								["Capteur PT100","La température fait varier la résistance électrique du platine ; l'appareil mesure cette résistance et en déduit la température.","Bonne précision | bonne stabilité | bonne répétabilité | plage de mesure importante | "+avantagesContact,"Nécessite une alimentation et une électronique de mesure | réponse généralement moins rapide qu'un thermocouple | la mesure peut être influencée par les conditions de montage. | "+inconvenientsContact],
								["Thermocouple","Une différence de température entre deux jonctions de métaux différents produit une tension électrique (effet Seebeck).","Très rapide | peu coûteux | petites dimensions | adapté aux températures élevées et aux vibrations | "+avantagesContact,"Ils fonctionnent avec des piles ou une batterie | Moins précis qu'un PT100 | "+inconvenientsContact],

								];

			body.innerHTML = body.innerHTML + "<table>"+

			"<tr><td style=\"width:10%;\">"+tabThermometre[1][0]+"</td><td style=\"width:19%;\">"+tabThermometre[1][1]+"</td><td>"+tabThermometre[1][2]+"</td><td>"+tabThermometre[1][3]+"</td></tr>"+

			"</table>"
			
			for(let i=0;i<=nbEleves;i++)
			{

			
			C1 = Math.floor(Math.random()*200);
			C2 = Math.floor(Math.random()*200);
			//indiceThermo = Math.floor(Math.random()*3);
			indiceThermo = nbEleves%5;
			
			while(C1 == C2)
			{
				C2 = Math.floor(Math.random()*200);
			}
			
			C1=C1-60;
			C2=C2-60;
			
			K1=C1+273;
			K2=C2+273;
			


	
			enonce = document.getElementsByClassName("enonce")[0];
		
			reponse = document.getElementById("reponse");
                                                                                                                                        
			
				sujet = document.getElementById("sujet");

				reponse = document.createElement("div");
				reponse.setAttribute("class","reponse");
//				reponse.setAttribute("style","break-after: page;");
				reponse.innerHTML = "BTS TP  - "+nomInterro+" - Correction numéro "+i+"<br>" +
			"<br>(/0.5) Question 1 : Convertissez en Kelvin la température de "+C1+" °C : "+K1+",15 K"+
				 "<br>(/0.5) Question 2 : Convertissez en degrés Celsius la température de "+K2+",15 K : "+C2+" °C<br>"+
				 "Question 3 : Vous disposez d'un "+tabThermometre[indiceThermo][0]+".<br>(/0.5) Donnez le principe de fonctionnement de ce type de thermomètre : <br>"+tabThermometre[indiceThermo][1]+

				 "<br><br>(/1) Donnez 2 inconvénients de ce type de thermomètre : <br>"+tabThermometre[indiceThermo][3] +
				 "<br><br>";                                                                                                                                                                    
	
				//"<p >Pour la conversion hexa vers binaire ( et réciproquement ) on utilise le tableau<br>"+
				//"Pour la conversion du décimal vers une autre base, on utilise les divisions successives ( de 2 pour le binaire et de 16 pour l'hexa )<br>"+
				//"Pour la conversion du binaire vers le décimal, on utilise les puissances de 2 ( ou les puissances de 16 pour l'hexa )</p>";		
				sujet.appendChild(reponse);
				
				divId=document.createElement("div");
				divId.setAttribute("class","identite");
			
				divNom=document.createElement("div");
				divNom.innerHTML="<br>Nom : "

				divId.appendChild(divNom);

				sujet.appendChild(divSujet);

				 "(/1) Donnez 2 avantages de ce type de thermomètre : <br><br><br><br><br>"+
				 "(/1) Donnez 2 inconvénients de ce type de thermomètre : <br><br><br><br><br>"+
				"";
				
				sujet.appendChild(enonce);
