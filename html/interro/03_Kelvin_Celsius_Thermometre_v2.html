<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../../css/style.css">

        <title>générateur exercice - Température et thermomètre</title>
    </head>
    <body>
	
		<style>
			table {
				border : solid 1px white;
			}
			
			td {
				border : solid 1px white;
				width:200px;
				height:40px;
				text-align:center;
			}

			body{
				font-size: 1.5em;
			}
			
			.cache {
				display:none;
			}
			
			sub, sup {
				font-size : 0.5em;
			}
			

			#affiche {
			margin:25px 0px 25px 0px;
			padding : 10px;
			border : 1px solid #eeeeee;
			border-radius : 10px;
			background : #333333;
			width : fit-content;
			}
			
			#reponse .big {
				font-size: 1em;
			}
			
		@media screen and (min-width: 795px) {
			body{
				font-size: 1em;
				}
			}				
			
		</style>
		<header>
			<p><a href="https://maristudy.github.io/BTS_TP_PhysiqueChimie/"> accueil du site </a> </p>
		</header>
		<main>
		

			<a href="../../index.html">Retour à l'accueil</a>
			<div class="enonce">
				<p>	x<sub>A</sub><sup>2</sup></p>
			</div>
			<p id="affiche">Afficher la réponse</p>
			<div id="reponse" class="cache">
			
			</div>

		</main>
		<footer>

		</footer>
		
		<script>
						
			C1 = Math.floor(Math.random()*200);
			C2 = Math.floor(Math.random()*200);
			indiceThermo = Math.floor(Math.random()*3);
			
			while(C1 == C2)
			{
				C2 = Math.floor(Math.random()*200);
			}
			
			C1=C1-60;
			C2=C2-60;
			
			K1=C1+273;
			K2=C2+273;
			
			avantagesContact="<br>On peut mesurer une température de surface si la sonde ou la surface le permet<br>On peut mesurer une température interne lorsque la sonde pénètre dans la matière<br>On peut mesurer la température d'un gaz ou d'un liquide";
			inconvenientsContact="Le temps de réponse est assez lent. Il faut attendre que le thermomètre se mette à l'équilibre thermique<br>L'exactitude de la mesure dépend de la qualité du contact sonde/cible<br>La température maximale est limitée par la résistance des matériaux";
			
			avantagesIR="La mesure est instantanée<br>Ils peuvent mesurer les températures très élevées<br>Ils fonctionnent lorsqu'il est impossible de toucher la cible (liquide corrosif, cylindre en rotation)<br>La mesure est fiable et rapide";
			inconvenientsIR="Il peut mesurer uniquement une température de surface<br>On ne peut pas mesurer la température d'un gaz<br>il faut configurer l'emissivité<br>Il fonctionne avec des pile ou une batterie";
						
			tabThermometre =[ 	["Thermomètre à liquide","Un liquide coloré se dilate dans un tube en verre. ","Fonctionne sans électricité<br>La mesure est précise<br>En fonction du choix du liquide et des matériaux, il peut être utilisé entre -200°C et +1000 °C"+avantagesContact,"Le tube de verre est très fragile<br>"+inconvenientsContact] ,
								["Thermomètre bimétallique","Il est composé d'une lame bimétallique qui se déforme sous l'effet de la chaleur. Cette déformation fait bouger une aiguille qui indique la température","Fonctionne sans électricité"+avantagesContact,"Le temps de réponse est lent<br>Ils sont sensibles aux vibrations"+inconvenientsContact],
								["Capteur PT100","La température fait varier la résistance électrique du platine ; l'appareil mesure cette résistance et en déduit la température.","Bonne précision, bonne stabilité<br> bonne répétabilité, plage de mesure importante."+avantagesContact,"Nécessite une alimentation et une électronique de mesure <br> réponse généralement moins rapide qu'un thermocouple <br> la mesure peut être influencée par les conditions de montage.<br>"+inconvenientsContact],
								["Thermocouple","Une différence de température entre deux jonctions de métaux différents produit une tension électrique (effet Seebeck).","Très rapide, peu coûteux, petites dimensions<br> adapté aux températures élevées et aux vibrations."+avantagesContact,"Ils fonctionnent avec des piles ou une batterie<br>Moins précis qu'un PT100<br>"+inconvenientsContact],
								["Thermomètre Infrarouge","Un objet émet un rayonnement infrarouge ; le thermomètre le détecte et en déduit sa température de surface.",""+avantagesIR,""+inconvenientsIR]
								];
			
			enonce = document.getElementsByClassName("enonce")[0];
			enonce.innerHTML= "<br>(/0.5) Question 1 : Convertissez en Kelvin la température de "+C1+" °C : <br><br>"+
				 "<br>(/0.5) Question 2 : Convertissez en degrés Celsius la température de "+K2+",15 K : <br><br>"+
				 "Question 3 : Vous disposez d'un "+tabThermometre[indiceThermo][0]+".<br>(/0.5) Donnez le principe de fonctionnement de ce type de thermomètre : <br><br><br><br><br>"+
				 "(/1) Donnez 2 avantages de ce type de thermomètre : <br><br><br><br><br>"+
				 "(/1) Donnez 2 inconvénients de ce type de thermomètre : <br><br><br><br><br>";
				 
		<!-- <sub> pour indice <sup> pour exposant &infin; symbole infini ; &Delta symbol delta;-->
		<!-- https://www.w3schools.com/html/html_symbols.asp -->
		
			reponse = document.getElementById("reponse");
			reponse.innerHTML= "<br>(/0.5) Question 1 : Convertissez en Kelvin la température de "+C1+" °C : "+K1+",15 K"+
				 "<br>(/0.5) Question 2 : Convertissez en degrés Celsius la température de "+K2+",15 K : "+C2+" °C<br>"+
				 "Question 3 : Vous disposez d'un "+tabThermometre[indiceThermo][0]+".<br>(/0.5) Donnez le principe de fonctionnement de ce type de thermomètre : <br>"+tabThermometre[indiceThermo][1]+
				 "<br><br>(/1) Donnez 2 avantages de ce type de thermomètre : <br>"+tabThermometre[indiceThermo][2]+
				 "<br><br>(/1) Donnez 2 inconvénients de ce type de thermomètre : <br>"+tabThermometre[indiceThermo][3];                                                                                                                                        
	

			affiche=document.getElementById("affiche");
			affiche.addEventListener("click",() => {
				document.getElementById("reponse").classList.toggle("cache");
		
			});
			
		</script>
		
	</body>
</html>
