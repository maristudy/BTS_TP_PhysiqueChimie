		<script>
		
			let nbEleves = 15;
			let nomInterro = "mesure et incertitude";
			
			tabDelta = [ //delta1, delta2, delta3, s
			[0,0.5,1.5,1],
			[0,0.9,1.3,1],

			[0,1.8,2.6,2],

			[0.5,2.5,4,3],

			[1.6,4.5,6.3,5],

			for(let i=0;i<=nbEleves;i++)
			{

			moyenne = Math.floor(Math.random()*10)+25;

			indice = i;
			m1 = moyenne - tabDelta[indice][0];
			m2 = moyenne + tabDelta[indice][0];
			m3 = moyenne - tabDelta[indice][1];
			m4 = moyenne + tabDelta[indice][1];
			m5 = moyenne - tabDelta[indice][2];
			m6 = moyenne + tabDelta[indice][2];
			
			tabMesure=[m1,m2,m3,m4,m5,m6];
			tabMesureOrdo=tabMesure.toSorted();
			
			s=tabDelta[indice][3]	
			
				sujet = document.getElementById("sujet");

				reponse = document.createElement("div");
				reponse.setAttribute("class","reponse");
				reponse.innerHTML = "BTS TP 1 - "+nomInterro+" - Correction numéro "+i+"<br><br>" +
			"Les mesures triées en ordre croissant : "+tabMesureOrdo.toString().replaceAll(","," / ").replaceAll("."," , ")+" (0,5 point par bonne réponse)<br>"+
			"1/ minimum : "+tabMesureOrdo[0]+" <br>2/ maximum : "+tabMesureOrdo[tabMesureOrdo.length-1]+" <br>3/ Q1 : "+tabMesureOrdo[1]+" <br>4/ Q3 "+tabMesureOrdo[4]+" <br>5/ la valeur moyenne : "+moyenne+" <br>6/ L'écart-type expérimental : "+s+
				"<br><br>";                                                                                                                                                                    
	
				//"<p >Pour la conversion hexa vers binaire ( et réciproquement ) on utilise le tableau<br>"+
				//"Pour la conversion du décimal vers une autre base, on utilise les divisions successives ( de 2 pour le binaire et de 16 pour l'hexa )<br>"+
				//"Pour la conversion du binaire vers le décimal, on utilise les puissances de 2 ( ou les puissances de 16 pour l'hexa )</p>";		
				sujet.appendChild(reponse);
				
				divId=document.createElement("div");
				divId.setAttribute("class","identite");
			
				divNom=document.createElement("div");
				divNom.innerHTML="<br>Nom : "
			
				divPrenom=document.createElement("div");
				divPrenom.innerHTML="<br>Prénom : ";

				divId.appendChild(divNom);
				divId.appendChild(divPrenom);
				
				sujet.appendChild(divId);
				
				
				divSujet = document.createElement("div");
				divSujet.setAttribute("class","nbSujet");
				divSujet.innerHTML = "BTS TP 1 - "+nomInterro+" - Sujet numéro "+i;
				
				sujet.appendChild(divSujet);
			
				enonce=document.createElement("div");
			enonce.innerHTML= "<br>"+
				"On vous donne les mesures suivantes : "+tabMesure.toString().replaceAll(","," / ").replaceAll(".",",")+"<br>"+

				"";
				
				sujet.appendChild(enonce);

//				sujet.appendChild(espace);


			
			}
