		<script>
		
			let nbEleves = 15;
			let nomInterro = "Température et thermomètre";
			
		
	body=document.getElementById("sujet");
	tab=document.createElement("p");
	body.appendChild(tab);
			
			
			
			for(let i=0;i<=nbEleves;i++)
			{

			
			C1 = Math.floor(Math.random()*200);
			C2 = Math.floor(Math.random()*200);
			indiceThermo = Math.floor(Math.random()*3);
			
			while(C1 == C2)
			{
				C2 = Math.floor(Math.random()*200);
			}
			
			C1=C1-60;
			C2=C2-60;
			
			K1=C1+273;
			K2=C2+273;
			
			avantagesContact="<br>On peut mesurer une température de surface si la sonde ou la surface le permet<br>On peut mesurer une température interne lorsque la sonde pénètre dans la matière<br>On peut mesurer la température d'un gaz ou d'un liquide";
			inconvenientsContact="Le temps de réponse est assez lent. Il faut attendre que le thermomètre se matte à l'équilibre thermique<br>L'exactitude de la mesure dépend de la qualité du contact sonde/cible<br>La température maximale est limitée par la résistance des matériaux";
			
			avantagesIR="La mesure est instantanée<br>Ils peuvent mesurer les températures très élevées<br>Ils fonctionnent lorsqu'il est impossible de toucher la cible (liquide corrosif, cylindre en rotation)<br>La mesure est fiable et rapide";
			inconvenientsIR="Il peut mesurer uniquement une température de surface<br>On ne peut pas mesurer la température d'un gaz<br>il faut configurer l'emissivité<br>Il fonctionne avec des pile ou une batterie";
						
			tabThermometre =[ 	["Thermomètre à tube de verre","Un liquide coloré se dilate","Fonctionne sans électricité<br>La mesure est précise<br>En fonction du choix du liquide, il peut être utilisé entre -200°C et +1000 °C"+avantagesContact,"Le tube de verre est très fragile<br>"+inconvenientsContact] ,
								["Thermomètre bimétallique","Il est composé d'une lame bimétallique qui se déforme sous l'effet de la chaleur. Cette déformation fait bouger une aiguille qui indique la température","Fonctionne sans électricité"+avantagesContact,"Le temps de réponse est lent<br>Ils sont sensibles aux vibrations"+inconvenientsContact],
								["Thermomètre électronique","Il est composé d'un capteur qui transforme la chaleur en une résistance électrique. En mesurant cette résistance électrique, on peut en déduire la température",""+avantagesContact,"Ils fonctionnent avec des piles ou une batterie<br>"+inconvenientsContact],
								["Thermomètre Infrarouge","Le rayonnement émis par une surface est focalisé par une lentille vers un détecteur infrarouge dont le signal de sortie est converti en mesure lisible sur l’afficheur du thermomètre.",""+avantagesIR,""+inconvenientsIR]
								];

	
			enonce = document.getElementsByClassName("enonce")[0];
		
			reponse = document.getElementById("reponse");
                                                                                                                                        
			
				sujet = document.getElementById("sujet");

				reponse = document.createElement("div");
				reponse.setAttribute("class","reponse");
//				reponse.setAttribute("style","break-after: page;");
				reponse.innerHTML = "BTS TP  - "+nomInterro+" - Correction numéro "+i+"<br>" +
			"<br>(/0.5) Question 1 : Convertissez en Kelvin la température de "+C1+" °C : "+K1+",15 K"+
				 "<br>(/0.5) Question 2 : Convertissez en degrés Celsius la température de "+K2+",15 K : "+C2+" °C<br>"+
				 "Question 3 : Vous disposez d'un "+tabThermometre[indiceThermo][0]+".<br>(/0.5) Donnez le principe de fonctionnement de ce type de thermomètre : <br>"+tabThermometre[indiceThermo][1]+
				 "<br><br>(/1) Donnez 2 avantages de ce type de thermomètre : <br>"+tabThermometre[indiceThermo][2]+
				 "<br><br>(/1) Donnez 2 inconvénients de ce type de thermomètre : <br>"+tabThermometre[indiceThermo][3] +
				 "<br><br>";                                                                                                                                                                    
	
				//"<p >Pour la conversion hexa vers binaire ( et réciproquement ) on utilise le tableau<br>"+
				//"Pour la conversion du décimal vers une autre base, on utilise les divisions successives ( de 2 pour le binaire et de 16 pour l'hexa )<br>"+
				//"Pour la conversion du binaire vers le décimal, on utilise les puissances de 2 ( ou les puissances de 16 pour l'hexa )</p>";		
				sujet.appendChild(reponse);
				
				divId=document.createElement("div");
				divId.setAttribute("class","identite");
			
				divNom=document.createElement("div");
				divNom.innerHTML="<br>Nom : "
			
				divPrenom=document.createElement("div");
				divPrenom.innerHTML="<br>Prénom : ";

				divId.appendChild(divNom);
				divId.appendChild(divPrenom);
				
				sujet.appendChild(divId);
				
				
				divSujet = document.createElement("div");
				divSujet.setAttribute("class","nbSujet");
				divSujet.innerHTML = "BTS TP - "+nomInterro+" - Sujet numéro "+i;
				
				sujet.appendChild(divSujet);
			
				enonce=document.createElement("div");
			enonce.innerHTML= "<br>"+"<br>(/0.5) Question 1 : Convertissez en Kelvin la température de "+C1+" °C : <br><br>"+
				 "<br>(/0.5) Question 2 : Convertissez en degrés Celsius la température de "+K2+",15 K : <br><br>"+
				 "Question 3 : Vous disposez d'un thermomètre "+tabThermometre[indiceThermo][0]+".<br>(/0.5) Donnez le principe de fonctionnement de ce type de thermomètre : <br><br><br><br><br>"+
				 "(/1) Donnez 2 avantages de ce type de thermomètre : <br><br><br><br><br>"+
				 "(/1) Donnez 2 inconvénients de ce type de thermomètre : <br><br><br><br><br>"+
				"";
				
				sujet.appendChild(enonce);
