<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../../css/style.css">

        <title>générateur exercice - mesure et incertitude</title>
    </head>
    <body>
	
		<style>
			table {
				border : solid 1px white;
			}
			
			td {
				border : solid 1px white;
				width:200px;
				height:40px;
				text-align:center;
			}

			body{
				font-size: 1.5em;
			}
			
			.cache {
				display:none;
			}
			
			sub, sup {
				font-size : 0.5em;
			}
			

			#affiche {
			margin:25px 0px 25px 0px;
			padding : 10px;
			border : 1px solid #eeeeee;
			border-radius : 10px;
			background : #333333;
			width : fit-content;
			}
			
			#reponse .big {
				font-size: 1em;
			}
			
		@media screen and (min-width: 795px) {
			body{
				font-size: 1em;
				}
			}				
			
		</style>
		<header>
			<p><a href="https://maristudy.github.io/BTS_TP_PhysiqueChimie/"> accueil du site </a> </p>
		</header>
		<main>
		

			<a href="../../index.html">Retour à l'accueil</a>
			<div class="enonce">
				<p>	x<sub>A</sub><sup>2</sup></p>
			</div>
			<p id="affiche">Afficher la réponse</p>
			<div id="reponse" class="cache">
			
			</div>

		</main>
		<footer>

		</footer>
		
		<script>
			
			
			tabDelta = [ //delta1, delta2, delta3, s
			[0,0.5,1.5,1],
			[0,0.9,1.3,1],
			[0,1,3,2],
			[0,1.8,2.6,2],
			[0,1.5,4.5,3],
			[0,2.7,3.9,3],
			[0,2,6,4],
			[0,3.6,5.2,4],
			[0,0.3,7.9,5],
			[0,2.5,7.5,5],
			[0,4.5,6.5,5],
			[0.1,3.2,3.5,3],
			[0.1,2,4.3,3],
			[0.1,2,4.3,5],
			[0.1,3.2,3.5,5],
			[0.3,0.4,1.5,1],
			[0.4,0.5,4.7,3],
			[0.5,0.9,1.2,1],
			[0.5,1.7,4.4,3],
			[0.5,2.5,4,3],
			[0.6,0.8,3,2],
			[0.6,0.8,3,2],
			[0.7,2.4,7.5,5],
			[0.7,5.1,6,5],
			[0.8,3.1,3.5,3],
			[0.9,1.2,4.5,3],
			[1,1.8,2.4,2],
			[1.1,2.3,4,3],
			[1.2,1.6,6,4],
			[1.3,2,4.1,3],
			[1.5,2.7,3.6,3],
			[1.5,2,7.5,5],
			[1.5,2.9,7.2,5],
			[1.5,4.8,6.1,5],
			[1.6,2.5,3.7,3],
			[1.6,4.5,6.3,5],
			[1.7,0.5,4.4,3],
			[1.7,1.9,4,3],
			[2,2.5,3.5,3],
			[2,3.6,4.8,4],
			[2,3.3,6.9,5],
			[2,5.1,5.7,5],
			[2.1,2.5,7.2,5],
			[2.1,4.7,6,5],
			[2.5,2.8,2.9,3],
			[2.5,4.5,6,5],
			[2.7,3.6,6.5,5],
			[3.3,4.5,5.6,5],
			[3.9,4.5,5.2,5]
			];

			moyenne = Math.floor(Math.random()*10)+25;
			indice = Math.floor(Math.random()*tabDelta.length);
			
			m1 = moyenne - tabDelta[indice][0];
			m2 = moyenne + tabDelta[indice][0];
			m3 = moyenne - tabDelta[indice][1];
			m4 = moyenne + tabDelta[indice][1];
			m5 = moyenne - tabDelta[indice][2];
			m6 = moyenne + tabDelta[indice][2];
			
			tabMesure=[m1,m2,m3,m4,m5,m6];
			tabMesureOrdo=tabMesure.toSorted();
			
			s=tabDelta[indice][3]		
			
			enonce = document.getElementsByClassName("enonce")[0];
			enonce.innerHTML= "On vous donne les mesures suivantes : "+tabMesure.toString().replaceAll(","," / ").replaceAll(".",",")+"<br>"+
				"En utilisant votre calculatrice, donnez les valeurs suivantes : (0,5 point par bonne réponse)<br>"+
				"1/ minimum : <br><br>2/ maximum : <br><br>3/ Q1 : <br><br>4/ Q3 <br><br>5/ la valeur moyenne : <br><br>6/ L'écart-type expérimental : <br><br>"+
				"";
		<!-- <sub> pour indice <sup> pour exposant &infin; symbole infini ; &Delta symbol delta;-->
		<!-- https://www.w3schools.com/html/html_symbols.asp -->
		
			reponse = document.getElementById("reponse");
			reponse.innerHTML= "Les mesures triées en ordre croissant : "+tabMesureOrdo.toString().replaceAll(","," / ").replaceAll(".",",")+"<br>"+
			"1/ minimum : "+tabMesureOrdo[0]+" <br>2/ maximum : "+tabMesureOrdo[tabMesureOrdo.length-1]+" <br>3/ Q1 : "+tabMesureOrdo[1]+" <br>4/ Q3 "+tabMesureOrdo[4]+" <br>5/ la valeur moyenne : "+moyenne+" <br>6/ L'écart-type expérimental : "+s+
				"";                                                                                                                                                                    
	

			affiche=document.getElementById("affiche");
			affiche.addEventListener("click",() => {
				document.getElementById("reponse").classList.toggle("cache");
		
			});
			
		</script>
		
	</body>
</html>
